name: CSV import browser QA
on:
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false --no-audit playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4394 --bind 127.0.0.1 > /tmp/csv-server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:4394/ > /dev/null && break; sleep 1; done
          node scripts/csv-browser-qa.cjs
